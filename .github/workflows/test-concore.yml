on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test concore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyzmq beautifulsoup4 lxml numpy scipy
      - name: Test import
        run: python -c "import concore; print('ok')"
