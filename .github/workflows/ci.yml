name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check . --output-format=github

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: |
          pytest --tb=short -q \
            --cov=concore_cli --cov=concore_base \
            --cov-report=term-missing \
            --ignore=measurements/ \
            --ignore=0mq/ \
            --ignore=ratc/ \
            --ignore=linktest/

  julia-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.10', '1']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Julia tests
        run: julia --color=yes tests/julia/runtests.jl
        shell: bash

  julia-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build Julia documentation
        run: julia --project=docs docs/make.jl

  julia-matlab-verilog-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set interop directory
        run: echo "CONCORE_INTEROP_DIR=$RUNNER_TEMP/concore-matlab-interop" >> "$GITHUB_ENV"

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run Verilog read tests
        run: |
          mkdir -p "$RUNNER_TEMP/verilog/in1"
          iverilog -g2012 -I. -o "$RUNNER_TEMP/verilog/test_read_simtime" tests/verilog/test_read_simtime.v
          cd "$RUNNER_TEMP/verilog" && vvp test_read_simtime

      - name: Run Verilog interop tests
        run: julia --color=yes tests/julia/test_verilog_interop.jl

      - uses: matlab-actions/setup-matlab@v3

      - name: Write Julia data for MATLAB
        run: julia --color=yes tests/julia/test_matlab_interop.jl write

      - name: Run MATLAB interop and wire-format tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(pwd); addpath(fullfile(pwd, 'tests', 'matlab')); test_julia_interop; test_literal_eval; test_write_advance

      - name: Read MATLAB data from Julia
        run: julia --color=yes tests/julia/test_matlab_interop.jl read

      - name: Remove interop files
        if: always()
        run: rm -rf "$CONCORE_INTEROP_DIR"

  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download jeromq
        run: |
          curl -fsSL --retry 5 --retry-connrefused -A "Mozilla/5.0" -o jeromq.jar https://repo1.maven.org/maven2/org/zeromq/jeromq/0.6.0/jeromq-0.6.0.jar || \
          curl -fsSL --retry 5 --retry-connrefused -A "Mozilla/5.0" -o jeromq.jar https://repo.maven.apache.org/maven2/org/zeromq/jeromq/0.6.0/jeromq-0.6.0.jar

      - name: Compile Java tests
        run: |
          javac -cp jeromq.jar ConcoreJavaRuntimeCore.java concore.java concoredocker.java TestLiteralEval.java TestConcoredockerApi.java TestConcoreApi.java

      - name: Run Java tests
        run: |
          java -cp .:jeromq.jar TestLiteralEval
          java -cp .:jeromq.jar TestConcoredockerApi
          java -cp .:jeromq.jar TestConcoreApi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if Dockerfile.py changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile.py'
              - 'requirements.txt'

      - name: Validate Dockerfile build
        if: steps.filter.outputs.dockerfile == 'true'
        run: docker build -f Dockerfile.py -t concore-py-test .

  cpp-shm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Parse concore.hpp standalone
        # -fsyntax-only parses concore.hpp without producing an object
        # file, so we don't need system SHM semaphores or shared-memory
        # segments to succeed. This catches header-level regressions on
        # the SHM transport (issue #195) without needing g++ at runtime.
        run: g++ -std=c++17 -Wall -Wextra -I. -fsyntax-only tests/test_shm_cpp_smoke.cpp

      - name: Build and run C++ parser tests
        run: |
          g++ -std=c++11 -Wall -Wextra -I. -o TestLiteralEvalCpp TestLiteralEvalCpp.cpp
          ./TestLiteralEvalCpp

      - name: Build and run C++ Concore API tests
        run: |
          g++ -std=c++11 -Wall -Wextra -I. -o TestConcoreHpp TestConcoreHpp.cpp
          ./TestConcoreHpp

  cpp-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and run C++ tests
        run: |
          g++ -std=c++11 -I. -o TestLiteralEvalCpp TestLiteralEvalCpp.cpp
          ./TestLiteralEvalCpp
          g++ -std=c++11 -I. -o TestConcoreHpp TestConcoreHpp.cpp
          ./TestConcoreHpp

  cpp-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run C++ tests
        run: |
          g++ -std=c++11 -I. -o TestLiteralEvalCpp TestLiteralEvalCpp.cpp
          ./TestLiteralEvalCpp
          g++ -std=c++11 -I. -o TestConcoreHpp TestConcoreHpp.cpp
          ./TestConcoreHpp

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

      - name: Check mkconcore's runtime files are in the installed package
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import importlib.util, os, re, sys

          repo = os.environ["GITHUB_WORKSPACE"]
          installed = os.path.dirname(importlib.util.find_spec("mkconcore").origin)
          source = open(os.path.join(installed, "mkconcore.py")).read()
          names = set(re.findall(r'CONCOREPATH\s*\+\s*"/([^"]+)"', source))
          names |= set(re.findall(r'os\.path\.join\(CONCOREPATH,\s*"([^"]+)"', source))
          # Only files that exist in the repo are expected in the package.
          missing = sorted(
              n for n in names
              if os.path.exists(os.path.join(repo, n))
              and not os.path.exists(os.path.join(installed, n))
          )
          if missing:
              sys.exit("Referenced by mkconcore.py but missing from the wheel: " + ", ".join(missing))
          print(f"OK: {len(names)} files referenced, none missing from the wheel")
          PY

      - name: Build studies with the installed concore command
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/concore" init proj
          "$RUNNER_TEMP/venv/bin/concore" build proj/workflow.graphml --source proj/src --output posix-out --type posix
          "$RUNNER_TEMP/venv/bin/concore" build proj/workflow.graphml --source proj/src --output docker-out --type docker
          "$RUNNER_TEMP/venv/bin/concore" build "$GITHUB_WORKSPACE/testsou/testSM1.graphml" --source "$GITHUB_WORKSPACE/testsou" --output cpp-out --type posix
          test -f cpp-out/src/concore.hpp
          test -f docker-out/src/Dockerfile.script
